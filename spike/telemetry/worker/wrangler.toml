# D39 — приймач телеметрії закритого тесту (Cloudflare Worker → R2).
#
# ⚠️ ТИМЧАСОВИЙ сервіс: живе рівно стільки, скільки закритий тест. Прибирається разом із текою
# `telemetry/` у застосунку — див. інструкцію в `app/build.gradle.kts`.
#
# Деплой — частина Дениса (акаунт його). Покроково → README.md поруч.

name = "streif-telemetry"
main = "src/index.js"
compatibility_date = "2026-01-01"

# ⚠️ ОКРЕМИЙ bucket, і причина не в охайності — у приватності.
#
# Спершу тут стояло `streif-tiles` (те саме, що під тайлами) з міркування «один bucket = один рахунок
# і одна точка видалення». Це було помилкою: у того bucket-а **увімкнено публічний Development URL**,
# бо через нього роздаються тайли, а публічний доступ в R2 вмикається на ВЕСЬ bucket — префікс із
# нього не виключити. Перевірено дослідом 2026-07-29: об'єкт, покладений під `telemetry/`, читався
# ззовні без жодної авторизації (`200`).
#
# Тобто пакети телеметрії лежали б у вільному доступі. Підібрати ключ ззовні практично неможливо
# (`telemetry/<день>/<install-uuid>-<мс>.json`, 122 біти ентропії, лістингу r2.dev не дає), але це
# «захист тим, що адресу не вгадають» — і він суперечить тому, що ми пообіцяли самі: політика
# приватності п. 10a описує знеособлену статистику на власний сервер, а `install` — рівно той номер,
# за яким людина може попросити видалити свої дані.
#
# `streif-telemetry` створено БЕЗ публічного URL. Побічно вийшло навіть чистіше прибирання після
# тесту: видалити bucket цілком, а не вичищати префікс у bucket-і з бойовими тайлами.
[[r2_buckets]]
binding = "TELEMETRY_BUCKET"
bucket_name = "streif-telemetry"

# ⚠️ Секрети — НЕ тут. У git вони не лягають (той самий гард, що для keystore, §B.6 #4). Обидва
# ставляться окремо:
#     wrangler secret put TELEMETRY_KEY        # клієнтський; він же в застосунку як `x-streif-key`
#     wrangler secret put TELEMETRY_ADMIN_KEY  # на читання /list і /get; він же `x-streif-admin`
#
# ⚠️ Значення мусять РІЗНИТИСЯ. Клієнтський лежить у APK, тож збіг відкрив би читання телеметрії всіх
# тестерів кожному, хто розпакував застосунок. Воркер відмовляє при збігу — див. `adminAllowed`.
#
# Спостереження: у Cloudflare Workers логи запитів за замовчуванням не зберігаються довго, і нам це
# підходить — IP у логах був би тим самим персональним слідом, якого ми уникаємо в самому пакеті.
# Logpush для цього воркера НЕ вмикати.
